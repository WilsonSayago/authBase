name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26.8"
          - "1.27.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test
        run: go test ./...

      - name: Build examples
        run: go build -o "${RUNNER_TEMP}/authbase-quickstart" ./examples/quickstart

      - name: Test (race)
        if: matrix.go == '1.27.1'
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        if: matrix.go == '1.27.1'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
