# CI quality gate for authBase.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility (go-min)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      # actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-go@v7.0.0
      - name: Set up Go 1.26.8
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.8"
          cache: true

      - name: Verify minimum Go compatibility
        run: make fmt-check mod-verify vet test quickstart

  verify:
    name: verify (go-preferred)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      # actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-go@v7.0.0
      - name: Set up Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify
        run: make verify
